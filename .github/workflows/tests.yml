name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    # Windows only: the driver uses the Win32 console API and Windows Terminal.
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  garde:
    # No internal reference in what is published: files, pull-request title, secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Internal references in files
        env:
          SD_GUARD_NAMES: ${{ secrets.SD_GUARD_NAMES }}
        run: node server/scripts/guard.mjs
      - name: Internal references in the pull-request title
        if: github.event_name == 'pull_request'
        env:
          SD_GUARD_NAMES: ${{ secrets.SD_GUARD_NAMES }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | node server/scripts/guard.mjs --text
      - name: Secrets (gitleaks, working tree)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-git --redact --no-banner
